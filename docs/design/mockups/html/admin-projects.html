<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=1920"><title>admin-projects — 项目审核</title><link rel="stylesheet" href="shared.css"><style>
  body { width: 1920px; height: 1080px; overflow: hidden; }
  .layout { display: flex; height: 100vh; }
  .sidebar { width: 220px; background: var(--bg-secondary); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; padding: 16px 12px; gap: 3px; }
  .sidebar-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; font-size: 13px; color: var(--text-secondary); text-decoration: none; }
  .sidebar-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
  .sidebar-item.active { background: rgba(99,102,241,.12); color: var(--accent); font-weight: 600; }
  .sidebar-icon { font-size: 16px; width: 20px; text-align: center; }
  .main { flex: 1; padding: 20px 28px; overflow-y: auto; }
  .review-card { padding: 18px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; display: flex; gap: 16px; align-items: center; }
  .review-card:hover { border-color: var(--accent); }
  .review-cover { width: 80px; height: 56px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 32px; flex-shrink: 0; }
  .review-info { flex: 1; }
  .review-name { font-size: 15px; font-weight: 700; }
  .review-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .review-detail { width: 280px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; flex-shrink: 0; }
</style></head><body>
<div class="layout">
<div class="sidebar">
  <div style="padding:8px 12px;font-size:14px;font-weight:700;margin-bottom:8px">⚙ 管理后台</div>
  <div class="sidebar-item"><span class="sidebar-icon">👥</span>用户管理</div>
  <div class="sidebar-item active"><span class="sidebar-icon">📁</span>项目审核</div>
  <div class="sidebar-item"><span class="sidebar-icon">📊</span>数据看板</div>
  <div class="sidebar-item"><span class="sidebar-icon">💰</span>计费管理</div>
  <div class="sidebar-item"><span class="sidebar-icon">🛡️</span>内容审核</div>
  <div class="sidebar-item"><span class="sidebar-icon">⚙</span>平台配置</div>
  <div class="sidebar-item"><span class="sidebar-icon">📋</span>系统日志</div>
</div>
<div class="main" style="display:flex;gap:16px">
<div style="flex:1">
  <div class="flex justify-between items-center mb-4">
    <div><span class="page-title">📁 项目审核</span><span style="font-size:13px;color:var(--text-muted);margin-left:8px">待审 12 · 今日 3</span></div>
    <div class="flex gap-2"><div class="search-box"><input class="input" placeholder="搜索项目…" style="width:180px;font-size:12px;padding:6px 10px"></div></div>
  </div>
  <div class="flex gap-2 mb-4"><span class="chip active">全部</span><span class="chip">⏳ 待审核</span><span class="chip">✅ 已通过</span><span class="chip">❌ 已驳回</span></div>
  <div class="review-card" style="border-color:rgba(245,158,11,.3)">
    <div class="review-cover" style="background:linear-gradient(135deg,rgba(102,126,234,.2),rgba(118,75,162,.1))">🌙</div>
    <div class="review-info"><div class="review-name">长安月下 <span class="badge badge-amber">待审核</span></div><div class="review-meta">梁总 · 古风宫廷 · 24 集 · 创建 5 分钟前 · 含 8 章分镜</div></div>
    <div class="flex gap-2"><button class="btn btn-sm" style="background:#10b981;color:#fff">通过</button><button class="btn btn-sm btn-danger">驳回</button><button class="btn btn-sm btn-ghost">查看详情</button></div>
  </div>
  <div class="review-card">
    <div class="review-cover" style="background:linear-gradient(135deg,rgba(240,147,251,.2),rgba(245,87,108,.1))">⚔️</div>
    <div class="review-info"><div class="review-name">剑破苍穹 <span class="badge badge-green">已通过</span></div><div class="review-meta">林染 · 仙侠 · 96 镜头 · 通过时间 2 小时前</div></div>
    <div class="flex gap-2"><button class="btn btn-sm btn-ghost">查看详情</button></div>
  </div>
  <div class="review-card" style="border-color:rgba(239,68,68,.2)">
    <div class="review-cover" style="background:linear-gradient(135deg,rgba(239,68,68,.2),rgba(239,68,68,.05))">🔥</div>
    <div class="review-info"><div class="review-name">逆袭少女 <span class="badge badge-red">已驳回</span></div><div class="review-meta">张三 · 都市 · 驳回原因：内容涉及敏感题材 · 驳回时间 昨天</div></div>
    <div class="flex gap-2"><button class="btn btn-sm btn-ghost">查看详情</button></div>
  </div>
</div>
<div class="review-detail">
  <div style="font-size:14px;font-weight:700;margin-bottom:8px">🌙 长安月下</div>
  <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px">待审核 · 提交 5 分钟前</div>
  <div class="flex flex-col gap-2" style="font-size:12px">
    <div class="flex justify-between"><span style="color:var(--text-muted)">作者</span><span>梁总</span></div>
    <div class="flex justify-between"><span style="color:var(--text-muted)">题材</span><span>古风宫廷</span></div>
    <div class="flex justify-between"><span style="color:var(--text-muted)">分镜数</span><span>24</span></div>
    <div class="flex justify-between"><span style="color:var(--text-muted)">角色数</span><span>6</span></div>
    <div class="flex justify-between"><span style="color:var(--text-muted)">内容检查</span><span style="color:#34d399">✅ 无违规</span></div>
  </div>
  <div class="mt-4"><div class="form-label">审核备注</div><textarea class="input" rows="2" placeholder="输入备注…" style="font-size:12px"></textarea></div>
  <div class="flex gap-2 mt-3"><button class="btn btn-sm" style="background:#10b981;color:#fff;flex:1">✅ 通过</button><button class="btn btn-sm btn-danger" style="flex:1">❌ 驳回</button></div>
</div>
</div>
</div>
</body></html>
