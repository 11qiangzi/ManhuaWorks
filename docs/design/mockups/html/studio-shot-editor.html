<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=1920"><title>分镜编辑</title><link rel="stylesheet" href="shared.css"><style>
  body { width: 1920px; height: 1080px; overflow: hidden; }
  .se-layout { display: flex; flex: 1; overflow: hidden; }
  .se-canvas { flex: 1; background: var(--bg-primary); display: flex; align-items: center; justify-content: center; position: relative; }
  .se-preview { width: 720px; height: 405px; border: 1px solid var(--border); border-radius: 8px; background: linear-gradient(135deg,rgba(102,126,234,.15),rgba(118,75,162,.08)); display: flex; align-items: center; justify-content: center; font-size: 64px; }
  .se-panel { width: 380px; background: var(--bg-secondary); border-left: 1px solid var(--border); padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
  .shot-header { padding: 12px 20px; background: var(--bg-secondary); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .shot-nav { display: flex; align-items: center; gap: 8px; }
  .cam-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; }
  .cam-option { padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-card); cursor: pointer; text-align: center; font-size: 11px; }
  .cam-option.active { border-color: var(--accent); background: rgba(99,102,241,.08); }
  .cam-option:hover { border-color: var(--border-strong); }
  .cam-icon { font-size: 24px; margin-bottom: 4px; display: block; }
  .param-row { display: flex; align-items: center; gap: 10px; }
  .param-label { width: 60px; font-size: 12px; color: var(--text-secondary); flex-shrink: 0; }
  .param-value { flex: 1; }
  .dialogue-item { padding: 10px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 6px; }
  .dialogue-char { font-size: 11px; color: var(--accent); font-weight: 600; margin-bottom: 2px; }
  .dialogue-text { font-size: 12px; }
</style></head><body>
<div class="layout-sidebar">
<div class="sidebar">
  <div class="sidebar-item">🏠 首页</div><div class="sidebar-item active">① 剧本创作</div><div class="sidebar-item">② 素材库</div><div class="sidebar-item">③ 工作流</div><div class="sidebar-item">④ 工具箱</div><div class="sidebar-item">⑤ 导出</div>
</div>
<div style="display:flex;flex-direction:column;flex:1;overflow:hidden">
<div class="shot-header">
  <div class="shot-nav">
    <button class="btn btn-xs btn-ghost">← 上一镜</button>
    <span style="font-size:14px;font-weight:700">第 2 镜 · 书房对白</span>
    <span class="badge badge-green">脚本完成</span>
    <button class="btn btn-xs btn-ghost">下一镜 →</button>
  </div>
  <div class="flex gap-2"><button class="btn btn-xs btn-ghost">📋 查看宫格</button><button class="btn btn-primary btn-sm">💾 保存</button></div>
</div>
<div class="se-layout">
<div class="se-canvas"><div class="se-preview">🎬 预览区</div></div>
<div class="se-panel">
  <div class="section-title">🎥 机位选择</div>
  <div class="cam-grid">
    <div class="cam-option active"><span class="cam-icon">🎬</span>中景<br><span style="font-size:9px;color:var(--text-muted)">人物对话</span></div>
    <div class="cam-option"><span class="cam-icon">🔍</span>特写<br><span style="font-size:9px;color:var(--text-muted)">表情强调</span></div>
    <div class="cam-option"><span class="cam-icon">🏞️</span>远景<br><span style="font-size:9px;color:var(--text-muted)">场景交代</span></div>
    <div class="cam-option"><span class="cam-icon">📐</span>俯拍<br><span style="font-size:9px;color:var(--text-muted)">空间关系</span></div>
  </div>
  <div class="section-title">🎭 运镜参数</div>
  <div class="param-row"><span class="param-label">运镜</span><select class="param-value input" style="width:100%"><option>静态固定</option><option>缓慢推近</option><option>水平横移</option></select></div>
  <div class="param-row"><span class="param-label">时长</span><div class="param-value"><input class="input" value="18" style="width:70px"> 秒</div></div>
  <div class="param-row"><span class="param-label">转场</span><select class="param-value input" style="width:100%"><option>硬切</option><option>淡入淡出</option><option>叠化</option></select></div>
  <div class="section-title">💬 对白</div>
  <div class="dialogue-item"><div class="dialogue-char">🎭 林启</div><div class="dialogue-text">父亲，我想下山去看看外面的世界。</div></div>
  <div class="dialogue-item"><div class="dialogue-char">🎭 林父</div><div class="dialogue-text">你可知山外是什么？不是风景，是江湖。</div></div>
  <button class="btn btn-sm btn-secondary" style="width:100%">+ 添加对白</button>
  <div class="section-title">🎨 风格覆盖</div>
  <div class="param-row"><span class="param-label">色调</span><select class="param-value input" style="width:100%"><option>跟随场景</option><option>暖黄</option><option>冷蓝</option></select></div>
  <div class="param-row"><span class="param-label">画风</span><select class="param-value input" style="width:100%"><option>跟随项目</option><option>动漫</option><option>写实</option></select></div>
</div>
</div>
</div>
</div>
</body></html>
