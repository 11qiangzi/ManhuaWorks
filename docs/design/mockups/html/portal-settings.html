<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=1440"><title>portal-settings — 设置</title><link rel="stylesheet" href="shared.css"><style>
  body { width: 1440px; height: 900px; overflow: hidden; }
  .portal-layout { display: flex; height: 100vh; }
  .portal-sidebar { width: 240px; background: var(--bg-secondary); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  .ps-brand { padding: 16px 16px 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
  .ps-user { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .ps-avatar { width: 36px; height: 36px; border-radius: 10px; background: var(--gradient); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 14px; flex-shrink: 0; }
  .ps-user-info { flex: 1; } .ps-user-name { font-size: 13px; font-weight: 600; } .ps-user-plan { font-size: 10px; color: var(--accent); }
  .ps-nav { flex: 1; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
  .ps-nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; font-size: 13px; color: var(--text-secondary); text-decoration: none; }
  .ps-nav-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
  .ps-nav-item.active { background: rgba(99,102,241,.12); color: var(--accent); font-weight: 600; }
  .ps-nav-icon { font-size: 16px; width: 20px; text-align: center; }
  .ps-nav-badge { margin-left: auto; font-size: 10px; padding: 1px 6px; border-radius: 8px; background: var(--accent); color: #fff; }
  .ps-credits { padding: 12px 16px; border-top: 1px solid var(--border); }
  .ps-credits-label { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-muted); margin-bottom: 4px; }
  .ps-credits-bar { height: 4px; background: var(--bg-tertiary); border-radius: 2px; overflow: hidden; }
  .ps-credits-fill { height: 100%; background: var(--gradient); border-radius: 2px; }
  .main-content { flex: 1; padding: 28px 32px; overflow-y: auto; }
  .ps-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; max-width: 700px; }
  .form-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .form-label-col { width: 100px; font-size: 13px; font-weight: 500; color: var(--text-secondary); text-align: right; flex-shrink: 0; }
  .form-input-col { flex: 1; }
  .danger-zone { margin-top: 24px; padding: 16px; border: 1px solid rgba(239,68,68,.25); border-radius: var(--radius); }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .toggle-label { font-size: 13px; font-weight: 500; } .toggle-desc { font-size: 11px; color: var(--text-muted); }
  .toggle-switch { width: 44px; height: 24px; border-radius: 12px; background: var(--bg-tertiary); border: 1px solid var(--border); position: relative; cursor: pointer; }
  .toggle-switch.on { background: var(--accent); border-color: var(--accent); }
  .toggle-dot { width: 18px; height: 18px; border-radius: 50%; background: #fff; position: absolute; top: 2px; left: 2px; }
  .toggle-switch.on .toggle-dot { left: 22px; }
</style></head><body>
<div class="portal-layout">
<div class="portal-sidebar">
  <div class="ps-brand"><div class="navbar-logo">M</div><span class="navbar-name">ManhuaWorks</span></div>
  <div class="ps-user"><div class="ps-avatar">梁</div><div class="ps-user-info"><div class="ps-user-name">创作者</div><div class="ps-user-plan">Pro 会员</div></div></div>
  <div class="ps-nav">
    <a href="#" class="ps-nav-item"><span class="ps-nav-icon">🏠</span>首页</a>
    <a href="#" class="ps-nav-item"><span class="ps-nav-icon">📁</span>我的项目<span class="ps-nav-badge">12</span></a>
    <a href="#" class="ps-nav-item"><span class="ps-nav-icon">🎞️</span>我的作品</a>
    <a href="#" class="ps-nav-item"><span class="ps-nav-icon">🗃️</span>素材库</a>
    <a href="#" class="ps-nav-item"><span class="ps-nav-icon">👥</span>团队</a>
    <div style="margin:8px 0 4px;padding:0 12px;font-size:10px;color:var(--text-muted);letter-spacing:.05em">创作工具</div>
    <a href="#" class="ps-nav-item"><span class="ps-nav-icon">🎬</span>创作者工作台</a>
    <a href="#" class="ps-nav-item"><span class="ps-nav-icon">🔑</span>BYOK 设置</a>
    <div style="margin:8px 0 4px;padding:0 12px;font-size:10px;color:var(--text-muted);letter-spacing:.05em">账户</div>
    <a href="#" class="ps-nav-item active"><span class="ps-nav-icon">⚙️</span>账号设置</a>
  </div>
  <div class="ps-credits"><div class="ps-credits-label"><span>本月积分</span><span>342/500 · 68%</span></div><div class="ps-credits-bar"><div class="ps-credits-fill" style="width:68%"></div></div></div>
</div>
<div class="main-content">
  <div class="section-title" style="margin-bottom:16px">设置</div>
  <div class="tabs"><span class="tab active">👤 账号</span><span class="tab">💎 订阅</span><span class="tab">🔑 BYOK</span><span class="tab">🔔 通知</span></div>
  <div class="ps-card">
    <div class="flex items-center gap-4 mb-6"><div style="width:64px;height:64px;border-radius:16px;background:var(--gradient);display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff">🎨</div><div><div style="font-size:18px;font-weight:700">创作者</div><div style="font-size:12px;color:var(--text-muted)">点击更换头像</div></div></div>
    <div class="form-row"><div class="form-label-col">显示名称</div><div class="form-input-col"><input class="input" value="创作者"></div></div>
    <div class="form-row"><div class="form-label-col">简介</div><div class="form-input-col"><textarea class="input" rows="3">漫改创作者，专注古风/仙侠题材</textarea></div></div>
    <div class="form-row"><div class="form-label-col">邮箱</div><div class="form-input-col"><input class="input" value="creator@manhuaworks.com" readonly style="opacity:.7"></div></div>
    <div class="flex justify-end"><button class="btn btn-primary">💾 保存</button></div>
  </div>
  <div class="section-title mt-4">🔔 通知设置</div>
  <div class="ps-card">
    <div class="toggle-row"><div><div class="toggle-label">项目更新</div><div class="toggle-desc">项目状态变更时发送通知</div></div><div class="toggle-switch on"><div class="toggle-dot"></div></div></div>
    <div class="toggle-row"><div><div class="toggle-label">团队协作</div><div class="toggle-desc">团队成员邀请、角色变更</div></div><div class="toggle-switch on"><div class="toggle-dot"></div></div></div>
    <div class="toggle-row"><div><div class="toggle-label">系统公告</div><div class="toggle-desc">平台更新、维护通知</div></div><div class="toggle-switch on"><div class="toggle-dot"></div></div></div>
    <div class="toggle-row"><div><div class="toggle-label">营销推送</div><div class="toggle-desc">新功能推荐、优惠活动</div></div><div class="toggle-switch"><div class="toggle-dot"></div></div></div>
  </div>
  <div class="danger-zone"><div class="flex justify-between items-center"><div><div style="font-size:14px;font-weight:600;color:#fca5a5">退出登录</div><div style="font-size:12px;color:var(--text-muted)">退出后需重新登录</div></div><button class="btn btn-danger">退出登录</button></div></div>
</div>
</div>
</body></html>
