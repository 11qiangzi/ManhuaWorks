<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=1920"><title>项目设置</title><link rel="stylesheet" href="shared.css"><style>
  body { width: 1920px; height: 1080px; overflow: hidden; }
  .ps-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; max-width: 800px; }
  .collab-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
</style></head><body>
<div class="layout-sidebar">
<div class="sidebar">
  <div class="sidebar-item">🏠 首页</div><div class="sidebar-item active">① 剧本创作</div><div class="sidebar-item">② 素材库</div><div class="sidebar-item">③ 工作流</div><div class="sidebar-item">④ 工具箱</div><div class="sidebar-item">⑤ 导出</div>
</div>
<div class="main-content">
  <div class="flex items-center gap-3 mb-4"><a href="#" style="color:var(--text-secondary);text-decoration:none">← 返回项目</a><span class="page-title">🌙 长安月下 · 项目设置</span></div>
  <div class="tabs"><span class="tab active">📋 基本信息</span><span class="tab">👥 协作成员</span><span class="tab">🔐 权限</span><span class="tab">🗑 危险操作</span></div>
  <div class="ps-card">
    <div class="flex flex-col gap-4">
      <div><div class="form-label">项目名称</div><input class="input" value="长安月下"></div>
      <div><div class="form-label">封面 Emoji</div><input class="input" value="🌙" style="width:80px;font-size:24px;text-align:center"></div>
      <div><div class="form-label">简介</div><textarea class="input" rows="3">古风宫廷长篇漫改。一位没落宗门少年，在长安城中卷入了宫廷与江湖的双重漩涡。</textarea></div>
      <div class="flex gap-4">
        <div style="flex:1"><div class="form-label">题材</div><select class="input"><option>古风</option><option>仙侠</option><option>都市</option><option>科幻</option></select></div>
        <div style="flex:1"><div class="form-label">目标集数</div><input class="input" value="24"></div>
        <div style="flex:1"><div class="form-label">默认风格</div><select class="input"><option>动漫</option><option>真人写实</option></select></div>
      </div>
      <div><div class="form-label">默认画幅</div><div class="flex gap-2"><span class="chip active">16:9</span><span class="chip">9:16</span><span class="chip">4:3</span><span class="chip">1:1</span></div></div>
    </div>
    <div class="flex justify-end mt-4"><button class="btn btn-primary">💾 保存设置</button></div>
  </div>
  <div class="section-title mt-4">👥 协作成员</div>
  <div class="ps-card">
    <div class="collab-row"><div class="avatar" style="background:var(--gradient);color:#fff">🧑</div><div style="flex:1"><div style="font-weight:600">我（创作者）</div><div style="font-size:11px;color:var(--text-muted)">me@manhuaworks.com</div></div><span class="badge badge-red">所有者</span></div>
    <div class="collab-row"><div class="avatar" style="background:linear-gradient(135deg,#34d399,#10b981);color:#fff">👩</div><div style="flex:1"><div style="font-weight:600">林染</div><div style="font-size:11px;color:var(--text-muted)">linran@manhuaworks.com</div></div><span class="badge badge-purple">管理员</span><button class="btn btn-xs btn-ghost">✏️</button></div>
    <div class="collab-row"><div class="avatar" style="background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff">👨</div><div style="flex:1"><div style="font-weight:600">老魏</div><div style="font-size:11px;color:var(--text-muted)">laowei@manhuaworks.com</div></div><span class="badge badge-green">编辑</span><button class="btn btn-xs btn-ghost">✏️</button></div>
    <button class="btn btn-sm btn-secondary mt-4">➕ 邀请成员</button>
  </div>
  <div class="section-title mt-4">🗑 危险操作</div>
  <div class="ps-card" style="border-color:rgba(239,68,68,.25)">
    <div class="flex justify-between items-center"><div><div style="font-weight:600;color:#fca5a5">归档项目</div><div style="font-size:12px;color:var(--text-muted)">归档后项目变为只读，可随时恢复</div></div><button class="btn btn-danger btn-sm">归档</button></div>
    <div class="flex justify-between items-center mt-4"><div><div style="font-weight:600;color:#fca5a5">删除项目</div><div style="font-size:12px;color:var(--text-muted)">永久删除所有数据，不可恢复</div></div><button class="btn btn-sm" style="background:rgba(239,68,68,.2);color:#fca5a5;border:1px solid rgba(239,68,68,.3)">删除项目</button></div>
  </div>
</div>
</div>
</body></html>
