user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # WebSocket 长连接升级
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ============================================================
    #  4 后端 upstream（L2 task 8 — 直连而非 api-gateway）
    #  user-service    :8088  → /api/users + /api/auth
    #  project-service :8089  → /api/projects
    #  billing-service :8090  → /api/billing
    #  collab-service  :8091  → /api/collab + /api/collab-ws
    # ============================================================
    upstream user_service    { server user-service:8088    keepalive 16; }
    upstream project_service { server project-service:8089 keepalive 16; }
    upstream billing_service { server billing-service:8090 keepalive 16; }
    upstream collab_service  { server collab-service:8091  keepalive 16; }

    # 兼容老路径：仍走 api-gateway
    upstream api_gateway { server api-gateway:8080; }

    # 4 前端（vite dev 端口）
    upstream web_app         { server web:3000         keepalive 8; }
    upstream studio_app      { server studio:3000      keepalive 8; }
    upstream admin_app       { server admin-portal:5174 keepalive 8; }
    upstream user_portal_app { server user-portal:5180 keepalive 8; }

    server {
        listen 80;
        server_name _;

        # ========================================================
        #  4 前端入口
        # ========================================================
        location /studio/ {
            proxy_pass http://web_app/;
            proxy_set_header Host $host;
        }
        location /app/ {
            proxy_pass http://user_portal_app/;
            proxy_set_header Host $host;
        }
        location /admin/ {
            proxy_pass http://admin_app/;
            proxy_set_header Host $host;
        }
        location /dev/ {
            proxy_pass http://web_app/;
            proxy_set_header Host $host;
        }
        # 旧版 ops 也走 web
        location /ops/ {
            proxy_pass http://web_app/;
            proxy_set_header Host $host;
        }

        # ========================================================
        #  4 后端 API（L2 task 8 — 按路径分流）
        # ========================================================

        # 鉴权 / 用户（user-service :8088）
        location /api/auth/ {
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/users/ {
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # 审计（如有）
        location /api/audit/ {
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 项目（project-service :8089）
        location /api/projects/ {
            proxy_pass http://project_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 计费（billing-service :8090）
        location /api/billing/ {
            proxy_pass http://billing_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 协作 REST（collab-service :8091）
        location /api/collab/ {
            proxy_pass http://collab_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 协作 WebSocket（collab-service :8091 /ws）
        # 前端路径：/api/collab-ws?project_id=...&token=...
        location /api/collab-ws {
            proxy_pass http://collab_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            # 后端实际路径是 /ws，因此 rewrite 把 /api/collab-ws 改成 /ws
            rewrite ^/api/collab-ws(.*)$ /ws$1 break;
        }

        # ========================================================
        #  兜底：所有 /api/* 走 api-gateway（保持旧逻辑）
        # ========================================================
        location /api/ {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 健康检查
        location /healthz {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location / {
            return 200 'ManhuaWorks Gateway OK';
            add_header Content-Type text/plain;
        }
    }
}
