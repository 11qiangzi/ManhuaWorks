# ============================================================
#  ManhuaWorks 閳?Nginx Server 閰嶇疆
#  2026-06-09 姊佹€?L4-C 閮ㄧ讲鑴氭湰 (L2-task-12 涔嬪悗, 鍙栨秷 Electron)
#
#  閫傜敤鍦烘櫙锛氭湰鍦板紑鍙?/ 棰勫彂 / 鐢熶骇 (缁熶竴閰嶇疆鏂囦欢, 宸紓鍖栬蛋鐜鍙橀噺)
#  鍔犺浇浣嶇疆锛氳 /etc/nginx/nginx.conf 閫氳繃 include /etc/nginx/conf.d/*.conf; 鎷夎捣
#
#  鏋舵瀯锛? portal + 4 service + 1 orchestrator
#    web          (vite dev :3000)   閳?涓荤珯 / 钀ラ攢椤?#    admin-portal (vite dev :5174)   閳?绠＄悊鍛樺悗鍙?#    studio       (vite dev :5175)   閳?鍒涗綔鑰呭伐浣滃彴 (AI 閲?
#    user-portal  (vite dev :5180)   閳?鐢ㄦ埛鍚庡彴 (L1+L2)
#
#    user-service     :8088  閳?/api/auth + /api/users + /api/audit
#    project-service  :8089  閳?/api/projects
#    billing-service  :8090  閳?/api/billing
#    collab-service   :8091  閳?/api/collab + WebSocket /api/collab-ws
#    ai-orchestrator  :8087  閳?/v1/orchestrate/* (AI 鍗曡繘绋? 鐩磋繛涓嶈鍓嶇鎰熺煡)
#
#  server_name qianjigongfang.cn *.qianjigongfang.cn; 褰撳鎴风甯?Upgrade: websocket 澶存椂,
# nginx 鎶?Connection 鏀规垚 upgrade, 閫忎紶缁欎笂娓?map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ==== 鐪熷疄瀹㈡埛绔?IP (CDN / 鍙嶄唬鍚庨潰) ====
# 鐪熷疄閮ㄧ讲濡傛灉鍓嶉潰鎸備簡 Cloudflare / SLB, 瑕佹墦寮€:
#   set_real_ip_from 10.0.0.0/8;
#   real_ip_header X-Forwarded-For;
# 鏈湴寮€鍙戝厛鍏虫帀, 閬垮厤鎷夸笉鍒扮湡瀹?IP

# ============================================================
#  Upstream 姹?#  - 鍏ㄩ儴璧?keepalive (16 閾炬帴), 閬垮厤姣忚姹傞兘鏂板缓 TCP
#  - 鍚嶅瓧 = 鏈嶅姟鍚? 璺?docker 缃戠粶鐨?service 鍚?/ 鏈湴杩涚▼绔彛涓€涓€瀵瑰簲
#  - 鐢?localhost:port 褰㈠紡, 鍥犱负 nginx 鍦?host 涓婅窇, 鐩磋繛 127.0.0.1
# ============================================================

# 4 鍚庣 service
upstream mhw_user_service    { server 127.0.0.1:8088  keepalive 16; }
upstream mhw_project_service { server 127.0.0.1:8089  keepalive 16; }
upstream mhw_billing_service { server 127.0.0.1:8090  keepalive 16; }
upstream mhw_collab_service  { server 127.0.0.1:8091  keepalive 16; }
# AI 缂栨帓 (M1-W4 鍚庢帴鍏? 鎻愬墠鎶?upstream 鍗犲ソ, 鍏嶅緱鏀?nginx)
upstream mhw_ai_orchestrator { server 127.0.0.1:8087  keepalive 16; }

# 4 鍓嶇 portal
upstream mhw_web_app         { server 127.0.0.1:3000  keepalive 8; }
upstream mhw_admin_app       { server 127.0.0.1:5174  keepalive 8; }
upstream mhw_studio_app      { server 127.0.0.1:5175  keepalive 8; }
upstream mhw_user_portal_app { server 127.0.0.1:5180  keepalive 8; }

# ============================================================
#  80 绔彛涓?server
#  listen 80锛氬紑鍙?+ 棰勫彂锛涚敓浜у墠闈㈡帴 CDN, 80 浠呭仛 HTTP鈫扝TTPS 璺宠浆
#  server_name qianjigongfang.cn *.qianjigongfang.cn;
    listen      [::]:80;
    server_name qianjigongfang.cn *.qianjigongfang.cn;

    # 瀛楃闆?/ 榛樿 1MB body, AI 璋冪敤鍙兘鏇村ぇ, 鍗曠嫭 location 瑕嗙洊
    charset     utf-8;
    client_max_body_size 10m;

    # 璁块棶鏃ュ織 / 閿欒鏃ュ織 (鏀惧湪 /var/log/nginx/mhw.*)
    access_log  /var/log/nginx/mhw.access.log;
    error_log   /var/log/nginx/mhw.error.log warn;

    # ========================================================
    #  閫氱敤浠ｇ悊鍙傛暟 (鏀捐繘涓€涓枃浠? 鎵€鏈?location include)
    #  - 鐪熷疄 IP
    #  - 鍗忚
    #  - Host (鍚庣鎸?host 璺敱, 蹇呴』閫忎紶)
    #  - X-Request-Id (缃戝叧娌℃敞鍏? 鎴戜滑鍦?nginx 杩欏眰琛? 鏂逛究鎺掗殰)
    # ========================================================
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;

    # ========================================================
    #  瀹夊叏澶?(鍩虹 XSS / clickjacking 闃叉姢)
    #  CSP 涓ユ牸妯″紡浼氳 vite dev HMR 鎸傛帀, 鎵€浠ュ彧鍔犵畝鍗曞嚑涓?    # ========================================================
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header X-Content-Type-Options   "nosniff"    always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # ========================================================
    #  gzip (nginx.conf 宸插紑 on, 杩欓噷鍙ˉ mime 鐧藉悕鍗?
    #  dev/prod 閮藉紑, vite 鏋勫缓浜х墿 gzip 鍚庝綋绉檷 60%+
    # ========================================================
    gzip_comp_level 6;
    gzip_min_length  1024;
    gzip_proxied     any;
    gzip_vary        on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/ttf
        font/otf;

    # ========================================================
    #  鍋ュ悍妫€鏌ョ鐐?(LB 鎺㈡椿, 閮ㄧ讲骞冲彴璋?
    #  鍐呴儴 /healthz 杩斿洖 200, 涓嶆墦鏃ュ織 (鍒峰睆)
    # ========================================================
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ========================================================
    #  4 鍓嶇 portal 鍏ュ彛
    #  璺敱绛栫暐锛氭寜 URL 鍓嶇紑鍒嗛厤, 璺熷弽鍚戜唬鐞嗚涔変竴鑷?    #    /        閳?web          (涓荤珯, 榛樿)
    #    /admin   閳?admin-portal (鍐呭祵 rewrite 鍘绘帀鍓嶇紑)
    #    /studio  閳?studio       (鍐呭祵 rewrite 鍘绘帀鍓嶇紑)
    #    /app     閳?user-portal  (鍐呭祵 rewrite 鍘绘帀鍓嶇紑)
    #
    #  娉ㄦ剰锛歷ite dev 榛樿 SPA 璺敱闈?fallback, 鎵€浠ュ繀椤荤敤 ^~ 鍓嶇紑鍖归厤
    #        鍚﹀垯 location /api/ 涔嬬被浼氬厛鍖归厤璧版帀
    # ========================================================
    location ^~ /admin/ {
        proxy_pass http://mhw_admin_app/;     # 鏈熬 / 浼氭妸 /admin/* rewrite 鎴?/*
    }
    location ^~ /studio/ {
        proxy_pass http://mhw_studio_app/;
    }
    location ^~ /app/ {
        proxy_pass http://mhw_user_portal_app/;
    }

    # 涓荤珯 web 鍏滃簳 (鏀惧湪鏈€鍚? 涓嶅甫鍓嶇紑, 鍖归厤 /)
    location / {
        proxy_pass http://mhw_web_app;
    }

    # ========================================================
    #  闈欐€佽祫婧愮紦瀛?(vite 鏋勫缓浜х墿鏀惧湪 /assets/, 寮虹紦瀛?1 骞?
    #  浠呭甯?hash 鏂囦欢鍚嶇殑 chunk 鐢熸晥 (vite 榛樿浼氬甫 ?v=xxx)
    #  瀵?index.html 璧?no-cache, 淇濊瘉鐏板害绔嬪嵆鐢熸晥
    # ========================================================
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico|wasm)$ {
        proxy_pass http://mhw_web_app;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;            # 闈欐€佽祫婧愪笉鎵撴棩蹇? 鍑忓皯 IO
    }
    location = /index.html {
        proxy_pass http://mhw_web_app;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # ========================================================
    #  4 鍚庣 API (鎸夊墠缂€鍒嗘祦, 涓嶈蛋 api-gateway)
    #  鍐崇瓥渚濇嵁 (L2 task 8): 鏃佽矾 api-gateway, 鐩磋繛 service,
    #  鍑忓皯涓€璺冲欢杩?+ 閬垮厤鍗曠偣鏁呴殰銆?    #  椤哄簭寰堥噸瑕? 闀跨殑鍓嶇紑鏀惧墠闈? 鐭殑 /api/ 鍏滃簳
    # ========================================================

    # ---- WebSocket 浼樺厛 (collab-service) ----
    # 鍓嶇璋冪敤鏂瑰紡: ws://host/api/collab-ws?project_id=...&token=...
    # 鍚庣瀹為檯璺緞: /ws (collab-service 鍐呴儴鎸傝浇鐐?
    location ^~ /api/collab-ws {
        proxy_pass http://mhw_collab_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 闀胯繛鎺?24h, 闃叉 nginx 60s 榛樿瓒呮椂韪㈡帀
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_connect_timeout 10s;
        # 鍏抽敭 rewrite: 鎶?/api/collab-ws 鏀规垚 /ws
        rewrite ^/api/collab-ws(.*)$ /ws$1 break;
    }

    # ---- REST API ----
    location ^~ /api/auth/   { proxy_pass http://mhw_user_service;    }
    location ^~ /api/users/  { proxy_pass http://mhw_user_service;    }
    location ^~ /api/audit/  { proxy_pass http://mhw_user_service;    }
    location ^~ /api/projects/ { proxy_pass http://mhw_project_service; }
    location ^~ /api/billing/  { proxy_pass http://mhw_billing_service; }
    location ^~ /api/collab/   { proxy_pass http://mhw_collab_service;  }

    # AI 缂栨帓 (M1-W4 鍚庡惎鐢? 鎻愬墠鎶婅矾鐢卞崰濂?
    # studio / web / user-portal 閮戒細璋?    location ^~ /v1/orchestrate/ {
        # AI 璋冪敤 body 杈冨ぇ, 鍗?location 瑕嗙洊
        client_max_body_size 50m;
        proxy_pass http://mhw_ai_orchestrator;
        proxy_read_timeout  300s;     # 缂栨帓涓€娆″彲鑳借窇鍑犲垎閽?        proxy_send_timeout  300s;
    }

    # 鍏滃簳: 鑰佺殑 /api/* 璧?user-service (閬垮厤鏀瑰墠绔殑鍚屾椂涓㈡祦閲?
    # 娉ㄦ剰: 蹇呴』鍦ㄦ墍鏈夊叿浣?location 涔嬪悗, 鍚﹀垯浼氳鍓嶉潰鐨?^~ 鎴儭
    location /api/ {
        proxy_pass http://mhw_user_service;
    }
}

