# ============================================================
#  ManhuaWorks 鈥?Nginx Server 配置
#  2026-06-09 梁总 L4-C 部署脚本 (L2-task-12 之后, 取消 Electron)
#
#  适用场景：本地开发 / 预发 / 生产 (统一配置文件, 差异化走环境变量)
#  加载位置：被 /etc/nginx/nginx.conf 通过 include /etc/nginx/conf.d/*.conf; 拉起
#
#  架构：4 portal + 4 service + 1 orchestrator
#    web          (vite dev :3000)   鈫?主站 / 营销页
#    admin-portal (vite dev :5174)   鈫?管理员后台
#    studio       (vite dev :5175)   鈫?创作者工作台 (AI 重)
#    user-portal  (vite dev :5180)   鈫?用户后台 (L1+L2)
#
#    user-service     :8088  鈫?/api/auth + /api/users + /api/audit
#    project-service  :8089  鈫?/api/projects
#    billing-service  :8090  鈫?/api/billing
#    collab-service   :8091  鈫?/api/collab + WebSocket /api/collab-ws
#    ai-orchestrator  :8087  鈫?/v1/orchestrate/* (AI 单进程, 直连不被前端感知)
#
#  server_name 占位：mhw.local
#    本地：编辑 C:\Windows\System32\drivers\etc\hosts 加 127.0.0.1 mhw.local
#    生产：换成真实域名（api.manhuaworks.com / studio.manhuaworks.com）
# ============================================================

# ==== WebSocket 升级映射 (4 service + 1 orchestrator 都需要) ====
# HTTP 1.1 默认 keep-alive 即可; 当客户端带 Upgrade: websocket 头时,
# nginx 把 Connection 改成 upgrade, 透传给上游
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ==== 真实客户端 IP (CDN / 反代后面) ====
# 真实部署如果前面挂了 Cloudflare / SLB, 要打开:
#   set_real_ip_from 10.0.0.0/8;
#   real_ip_header X-Forwarded-For;
# 本地开发先关掉, 避免拿不到真实 IP

# ============================================================
#  Upstream 池
#  - 全部走 keepalive (16 链接), 避免每请求都新建 TCP
#  - 名字 = 服务名, 跟 docker 网络的 service 名 / 本地进程端口一一对应
#  - 用 localhost:port 形式, 因为 nginx 在 host 上跑, 直连 127.0.0.1
# ============================================================

# 4 后端 service
upstream mhw_user_service    { server 127.0.0.1:8088  keepalive 16; }
upstream mhw_project_service { server 127.0.0.1:8089  keepalive 16; }
upstream mhw_billing_service { server 127.0.0.1:8090  keepalive 16; }
upstream mhw_collab_service  { server 127.0.0.1:8091  keepalive 16; }
# AI 编排 (M1-W4 后接入, 提前把 upstream 占好, 免得改 nginx)
upstream mhw_ai_orchestrator { server 127.0.0.1:8087  keepalive 16; }

# 4 前端 portal
upstream mhw_web_app         { server 127.0.0.1:3000  keepalive 8; }
upstream mhw_admin_app       { server 127.0.0.1:5174  keepalive 8; }
upstream mhw_studio_app      { server 127.0.0.1:5175  keepalive 8; }
upstream mhw_user_portal_app { server 127.0.0.1:5180  keepalive 8; }

# ============================================================
#  80 端口主 server
#  listen 80：开发 + 预发；生产前面接 CDN, 80 仅做 HTTP→HTTPS 跳转
#  server_name mhw.local 占位
# ============================================================
server {
    listen      80;
    listen      [::]:80;
    server_name mhw.local *.mhw.local;

    # 字符集 / 默认 1MB body, AI 调用可能更大, 单独 location 覆盖
    charset     utf-8;
    client_max_body_size 10m;

    # 访问日志 / 错误日志 (放在 /var/log/nginx/mhw.*)
    access_log  /var/log/nginx/mhw.access.log;
    error_log   /var/log/nginx/mhw.error.log warn;

    # ========================================================
    #  通用代理参数 (放进一个文件, 所有 location include)
    #  - 真实 IP
    #  - 协议
    #  - Host (后端按 host 路由, 必须透传)
    #  - X-Request-Id (网关没注入, 我们在 nginx 这层补, 方便排障)
    # ========================================================
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;

    # ========================================================
    #  安全头 (基础 XSS / clickjacking 防护)
    #  CSP 严格模式会让 vite dev HMR 挂掉, 所以只加简单几个
    # ========================================================
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header X-Content-Type-Options   "nosniff"    always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # ========================================================
    #  gzip (nginx.conf 已开 on, 这里只补 mime 白名单)
    #  dev/prod 都开, vite 构建产物 gzip 后体积降 60%+
    # ========================================================
    gzip_comp_level 6;
    gzip_min_length  1024;
    gzip_proxied     any;
    gzip_vary        on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/ttf
        font/otf;

    # ========================================================
    #  健康检查端点 (LB 探活, 部署平台调)
    #  内部 /healthz 返回 200, 不打日志 (刷屏)
    # ========================================================
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ========================================================
    #  4 前端 portal 入口
    #  路由策略：按 URL 前缀分配, 跟反向代理语义一致
    #    /        鈫?web          (主站, 默认)
    #    /admin   鈫?admin-portal (内嵌 rewrite 去掉前缀)
    #    /studio  鈫?studio       (内嵌 rewrite 去掉前缀)
    #    /app     鈫?user-portal  (内嵌 rewrite 去掉前缀)
    #
    #  注意：vite dev 默认 SPA 路由靠 fallback, 所以必须用 ^~ 前缀匹配
    #        否则 location /api/ 之类会先匹配走掉
    # ========================================================
    location ^~ /admin/ {
        proxy_pass http://mhw_admin_app/;     # 末尾 / 会把 /admin/* rewrite 成 /*
    }
    location ^~ /studio/ {
        proxy_pass http://mhw_studio_app/;
    }
    location ^~ /app/ {
        proxy_pass http://mhw_user_portal_app/;
    }

    # 主站 web 兜底 (放在最后, 不带前缀, 匹配 /)
    location / {
        proxy_pass http://mhw_web_app;
    }

    # ========================================================
    #  静态资源缓存 (vite 构建产物放在 /assets/, 强缓存 1 年)
    #  仅对带 hash 文件名的 chunk 生效 (vite 默认会带 ?v=xxx)
    #  对 index.html 走 no-cache, 保证灰度立即生效
    # ========================================================
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico|wasm)$ {
        proxy_pass http://mhw_web_app;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;            # 静态资源不打日志, 减少 IO
    }
    location = /index.html {
        proxy_pass http://mhw_web_app;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # ========================================================
    #  4 后端 API (按前缀分流, 不走 api-gateway)
    #  决策依据 (L2 task 8): 旁路 api-gateway, 直连 service,
    #  减少一跳延迟 + 避免单点故障。
    #  顺序很重要, 长的前缀放前面, 短的 /api/ 兜底
    # ========================================================

    # ---- WebSocket 优先 (collab-service) ----
    # 前端调用方式: ws://host/api/collab-ws?project_id=...&token=...
    # 后端实际路径: /ws (collab-service 内部挂载点)
    location ^~ /api/collab-ws {
        proxy_pass http://mhw_collab_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 长连接 24h, 防止 nginx 60s 默认超时踢掉
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_connect_timeout 10s;
        # 关键 rewrite: 把 /api/collab-ws 改成 /ws
        rewrite ^/api/collab-ws(.*)$ /ws$1 break;
    }

    # ---- REST API ----
    location ^~ /api/auth/   { proxy_pass http://mhw_user_service;    }
    location ^~ /api/users/  { proxy_pass http://mhw_user_service;    }
    location ^~ /api/audit/  { proxy_pass http://mhw_user_service;    }
    location ^~ /api/projects/ { proxy_pass http://mhw_project_service; }
    location ^~ /api/billing/  { proxy_pass http://mhw_billing_service; }
    location ^~ /api/collab/   { proxy_pass http://mhw_collab_service;  }

    # AI 编排 (M1-W4 后启用, 提前把路由占好)
    # studio / web / user-portal 都会调
    location ^~ /v1/orchestrate/ {
        # AI 调用 body 较大, 单 location 覆盖
        client_max_body_size 50m;
        proxy_pass http://mhw_ai_orchestrator;
        proxy_read_timeout  300s;     # 编排一次可能跑几分钟
        proxy_send_timeout  300s;
    }

    # 兜底: 老的 /api/* 走 user-service (避免改前端的同时丢流量)
    # 注意: 必须在所有具体 location 之后, 否则会被前面的 ^~ 截胡
    location /api/ {
        proxy_pass http://mhw_user_service;
    }
}

