# ManhuaWorks AlertManager — 飞书 webhook 路由
global:
  resolve_timeout: 5m
  smtp_smarthost: '${SMTP_HOST}:${SMTP_PORT}'
  smtp_from: '${SMTP_FROM}'
  smtp_auth_username: '${SMTP_USER}'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true

# 模板
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# 路由 — 按严重程度 + 服务分发
route:
  group_by: ['alertname', 'service', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-feishu'
  routes:
    # 严重 — 立即通知 + 邮件
    - matchers:
        - severity="critical"
      receiver: 'feishu-critical'
      group_wait: 10s
      repeat_interval: 1h
      continue: true

    - matchers:
        - severity="critical"
        - service="monitor"
      receiver: 'email-oncall'
      group_wait: 10s
      repeat_interval: 1h
      continue: true

    # 警告 — 汇总后通知
    - matchers:
        - severity="warning"
      receiver: 'feishu-warning'
      group_wait: 1m
      repeat_interval: 4h
      continue: true

    # 仅 billing 服务的 critical
    - matchers:
        - service="billing-service"
        - severity="critical"
      receiver: 'feishu-billing-oncall'
      group_wait: 5s
      repeat_interval: 30m

# 接收器
receivers:
  - name: 'default-feishu'
    webhook_configs:
      - url: '${FEISHU_WEBHOOK_URL_DEFAULT}'
        send_resolved: true
        max_alerts: 0
        http_config:
          proxy_url: ''

  - name: 'feishu-critical'
    webhook_configs:
      - url: '${FEISHU_WEBHOOK_URL_CRITICAL}'
        send_resolved: true
        max_alerts: 0

  - name: 'feishu-warning'
    webhook_configs:
      - url: '${FEISHU_WEBHOOK_URL_WARNING}'
        send_resolved: true
        max_alerts: 0

  - name: 'feishu-billing-oncall'
    webhook_configs:
      - url: '${FEISHU_WEBHOOK_URL_BILLING}'
        send_resolved: true
        max_alerts: 0
        # @oncall 标记 — 用于值班提醒

  # 邮件 — critical
  - name: 'email-oncall'
    email_configs:
      - to: '${ALERT_EMAIL_TO}'
        send_resolved: true
        headers:
          Subject: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} @ {{ .CommonLabels.service }}'
        html: |
          <h2>{{ .CommonLabels.alertname }} — {{ .Status | toUpper }}</h2>
          <p><b>Service:</b> {{ .CommonLabels.service }}<br/>
             <b>Severity:</b> {{ .CommonLabels.severity }}<br/>
             <b>Started:</b> {{ .CommonAnnotations.summary }}</p>
          <p>{{ .CommonAnnotations.description }}</p>
          <hr/><p><small>ManhuaWorks monitor</small></p>

# 抑制规则
inhibit_rules:
  - source_match:
      severity="critical"
    target_match:
      severity="warning"
    equal: ['alertname', 'service']
  - source_match:
      service="monitor"
    target_match:
      service!="monitor"
    equal: ['alertname']