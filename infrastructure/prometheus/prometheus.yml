# ManhuaWorks Prometheus 抓取配置
# scrape: 4 业务后端 + monitor + api-gateway
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: manhuaworks
    env: production

# 加载告警规则
rule_files:
  - '/etc/prometheus/rules.yml'

# 告警管理器
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# 抓取 targets
scrape_configs:
  # ----- prometheus 自监控 -----
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ----- API gateway -----
  - job_name: 'api-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api-gateway:8080']

  # ----- 4 业务后端 -----
  - job_name: 'user-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['user-service:8088']
        labels: { service: 'user-service', tier: 'backend' }

  - job_name: 'project-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['project-service:8089']
        labels: { service: 'project-service', tier: 'backend' }

  - job_name: 'billing-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['billing-service:8090']
        labels: { service: 'billing-service', tier: 'backend' }

  - job_name: 'collab-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['collab-service:8091']
        labels: { service: 'collab-service', tier: 'backend' }

  # ----- monitor -----
  - job_name: 'monitor'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['monitor:8092']
        labels: { service: 'monitor' }

  # ----- 节点自监控 (可选) -----
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']