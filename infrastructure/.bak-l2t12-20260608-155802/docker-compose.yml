version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mhw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mhw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mhw_dev_only}
      POSTGRES_DB: manhuaworks
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mhw"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mhw-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    container_name: mhw-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://mhw:${POSTGRES_PASSWORD:-mhw_dev_only}@postgres:5432/manhuaworks
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    build:
      context: ..
      dockerfile: services/user-service/Dockerfile
    container_name: mhw-user-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgresql://mhw:${POSTGRES_PASSWORD:-mhw_dev_only}@postgres:5432/manhuaworks
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: mhw-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8080

volumes:
  postgres-data:
  redis-data:
