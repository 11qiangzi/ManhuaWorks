# ManhuaWorks Monitor Stack
# 4 服务：prometheus :9090 + grafana :3000 + alertmanager :9093 + monitor :8092
# L2 task 14：追加 jaeger :16686(UI) :4318(OTLP HTTP)
version: '3.9'

services:
  # ============================================================
  # Prometheus
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: mhw-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alertmanager/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    networks:
      - mhw-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================================
  # Grafana
  # ============================================================
  grafana:
    image: grafana/grafana:11.3.0
    container_name: mhw-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - mhw-net
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================================
  # AlertManager
  # ============================================================
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: mhw-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    env_file:
      - .env
    environment:
      - FEISHU_WEBHOOK_URL_DEFAULT=${FEISHU_WEBHOOK_URL_DEFAULT}
      - FEISHU_WEBHOOK_URL_CRITICAL=${FEISHU_WEBHOOK_URL_CRITICAL}
      - FEISHU_WEBHOOK_URL_WARNING=${FEISHU_WEBHOOK_URL_WARNING}
      - FEISHU_WEBHOOK_URL_BILLING=${FEISHU_WEBHOOK_URL_BILLING}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_FROM=${SMTP_FROM:-ManhuaWorks <alerts@manhuaworks.com>}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO}
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - mhw-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================================
  # Monitor (本项目自家)
  # ============================================================
  monitor:
    build:
      context: ../services/monitor
      dockerfile: Dockerfile
    container_name: mhw-monitor
    restart: unless-stopped
    ports:
      - "8092:8092"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=8092
      - LOG_LEVEL=info
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - FEISHU_WEBHOOK_URL=${FEISHU_WEBHOOK_URL}
      - FEISHU_DEFAULT_AT=${FEISHU_DEFAULT_AT}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO}
      - GENERIC_WEBHOOK_URL=${GENERIC_WEBHOOK_URL}
      - SCRAPE_INTERVAL_MS=${SCRAPE_INTERVAL_MS:-15000}
      - HEALTH_PROBE_INTERVAL_MS=${HEALTH_PROBE_INTERVAL_MS:-10000}
      - TAIL_LOG_INTERVAL_MS=${TAIL_LOG_INTERVAL_MS:-5000}
      - TARGET_SERVICES=${TARGET_SERVICES}
      # L2 task 14: OpenTelemetry
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=monitor
      - OTEL_TRACES_ENABLED=true
    depends_on:
      - prometheus
      - jaeger
    networks:
      - mhw-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8092/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================================
  # Jaeger (L2 task 14: OpenTelemetry tracing backend)
  # ============================================================
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: mhw-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC (备用)
      - "4318:4318"     # OTLP HTTP ← 我们用这个
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_OTLP_HTTP_HOST_PORT=:4318
      - COLLECTOR_OTLP_GRPC_HOST_PORT=:4317
    networks:
      - mhw-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686/"]
      interval: 30s
      timeout: 5s
      retries: 3

# ============================================================
# Volumes
# ============================================================
volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:

# ============================================================
# Networks
# ============================================================
networks:
  mhw-net:
    driver: bridge
