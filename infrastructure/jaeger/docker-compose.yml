# ManhuaWorks Jaeger (OpenTelemetry tracing backend)
# L2 task 14
#
# 启动：  cd infrastructure/jaeger && docker compose up -d
# 停止：  cd infrastructure/jaeger && docker compose down
# UI：    http://localhost:16686
# OTLP：  4317 (gRPC), 4318 (HTTP)  ← 我们用 HTTP
#
# env 变量约定（4 业务后端 + api-gateway + monitor 都用）：
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
#   OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
#   OTEL_SERVICE_NAME=<service>
#   OTEL_RESOURCE_ATTRIBUTES=deployment.environment=development
#
# 在 docker network mhw-net 里，容器之间用「jaeger:4318」；
# 在本机进程（非容器）用「localhost:4318」。

version: '3.9'

services:
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: mhw-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC (留作可选)
      - "4318:4318"     # OTLP HTTP ← 我们用这个
      - "14268:14268"   # Jaeger collector (Thrift, 旧协议)
      - "14250:14250"   # gRPC 模型 (新协议)
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_OTLP_HTTP_HOST_PORT=:4318
      - COLLECTOR_OTLP_GRPC_HOST_PORT=:4317
    networks:
      - mhw-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  mhw-net:
    external: true
    name: mhw-net
